# Spring Application Configuration
spring.application.name=ai-riddle-game
server.port=8080

# Database Configuration (MySQL default with H2 fallback compatibility)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:riddledb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security JWT Settings
app.jwt.secret=${JWT_SECRET:SuperSecretJwtKeyForAIRiddleGameMiniProject2026Secure256BitLengthAtLeast}
app.jwt.expiration-ms=86400000

# AI Riddle Engine Configuration
app.ai.provider=${AI_PROVIDER:simulated}
app.ai.openai.api-key=${OPENAI_API_KEY:}
